<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Disc -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  
  <!-- Clapperboard Body -->
  <rect x="10" y="24" width="44" height="28" rx="4" fill="#E11D48"/>
  <rect x="10" y="24" width="44" height="6" fill="#BE123C"/>
  
  <!-- Film Slate Clapper Top -->
  <g transform="rotate(-12 10 22)">
    <rect x="10" y="14" width="44" height="10" rx="3" fill="#1E293B"/>
    <!-- Stripes -->
    <polygon points="14,14 20,14 16,24 10,24" fill="#F8FAFC"/>
    <polygon points="24,14 30,14 26,24 20,24" fill="#F8FAFC"/>
    <polygon points="34,14 40,14 36,24 30,24" fill="#F8FAFC"/>
    <polygon points="44,14 50,14 46,24 40,24" fill="#F8FAFC"/>
  </g>
  
  <!-- Play Accent inside Slate -->
  <polygon points="28,34 28,46 40,40" fill="#FFFFFF"/>
</svg>
