version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cineverse_postgres
    restart: always
    environment:
      POSTGRES_USER: cineverse_user
      POSTGRES_PASSWORD: cineverse_password
      POSTGRES_DB: cineverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: